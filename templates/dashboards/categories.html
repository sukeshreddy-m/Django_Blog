{% extends 'base.html' %}

{% block content %}

<div class="row">
    {% include 'dashboards/sidebar.html' %}
    <div class="col-md-9">
        <h2>All Categories</h2>
        <a href="{% url 'add_category' %}" class="btn btn-dark text-light float-right mb-2">Add New</a>
        <table class="table table-hover">
  <thead>
    <tr>
      <th scope="col">#</th>
      <th scope="col">Name</th>
      <th scope="col">Created At</th>
      <th scope="col">Updated At</th>
      <th scope="col">Action</th>
    </tr>
  </thead>
  <tbody>
    {% for i in categories %}
    <tr>
      <th scope="row">{{ forloop.counter }}</th>
      <td>{{i}}</td>
      <td>{{i.created_at}}</td>
      <td>{{i.updated_at}}</td>
      <td>
        <a href="{% url 'edit_category' i.id %}"><i class="fa fa-edit text-success"></i></a>
        &nbsp;
        <a href="{% url 'delete' i.id %}"><i class="fa fa-trash text-danger"></i></a>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
    </div>
</div>
{% endblock %}
