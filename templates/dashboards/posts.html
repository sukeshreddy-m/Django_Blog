{% extends 'base.html' %}

{% block content %}

<div class="row">
    {% include 'dashboards/sidebar.html' %}
    <div class="col-md-9">
        <h2>All Posts</h2>
        <a href="{% url 'add_post' %}" class="btn btn-dark text-light float-right mb-2">Add New</a>
        <table class="table table-hover">
  <thead>
    <tr>
      <th scope="col">#</th>
      <th scope="col">Title</th>
      <th scope="col">Category</th>
      <th scope="col">Author</th>
      <th>Status</th>
      <th>Featured</th>
      <th scope="col">Action</th>
    </tr>
  </thead>
  <tbody>
    {% for i in posts %}
    <tr>
      <th scope="row">{{ forloop.counter }}</th>
      <td>{{i}}</td>
      <td>{{i.category}}</td>
      <td>{{i.author}}</td>
      <td>{{i.status}}</td>
      <td>{{i.is_featured}}</td>
      <td>
        <a href="{% url 'edit_post' i.id %}"><i class="fa fa-edit text-success"></i></a>
        &nbsp;
        <a href="{% url 'delete_post' i.id %}"><i class="fa fa-trash text-danger"></i></a>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
    </div>
</div>
{% endblock %}
