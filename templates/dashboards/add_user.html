{% extends 'base.html' %}

{% block content %}

{% load crispy_forms_tags %}

<div class="row">
    {% include 'dashboards/sidebar.html' %}
    <div class="col-md-9">
        <h2>Add New User</h2>
        <form action="{% url 'add_user' %}" method="post" style="width: 500px;">
            {% csrf_token %}
            {{form | crispy }}
            <button type="submit" class="btn btn-warning">Submit</button>
        </form>
    </div>
</div>

{% endblock %}
