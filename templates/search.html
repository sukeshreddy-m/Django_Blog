{% extends 'base.html' %}

{% block content %}
 
<h3 class="text-uppercase text-warning" style="letter-spacing: 2px;">Results for '{{keyword}}'</h3>

  <div class="row mb-2">
    {% if blogs %}
    {% for i in blogs %}
    <div class="col-md-6">
      <div class="card border-0" >
        <div class="card-body">
          <h3><a href="{% url 'blog' i.slug %}"> {{i.title}}</a></h3>
          <small class="mb-1 text-muted">{{ i.created_at | timesince }} | {{i.author}}</small>
          <p class="card-text">{{i.short_description | truncatewords:20 }}</p>
        </div>
      </div>
    </div>
    {% endfor %}
    {% else %}
    <h1>No Posts Found</h1>
    {% endif %}

  </div>

{% endblock %}
